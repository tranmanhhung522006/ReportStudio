services:
  - type: web
    name: reportstudio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn production:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLEANUP_TOKEN
        generateValue: true
      - key: ENABLE_PDF
        value: "0"
      - key: ENABLE_AI
        value: "0"

      - key: PERSONAL_ACCESS_CODE
        sync: false
      - key: PDF_MAX_MB
        value: "5"
